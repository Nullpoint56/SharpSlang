name: CI

# What runs, and when, is a measured decision rather than a default.
#
# The first version of this workflow ran on every push to every branch, and again on main after
# each merge. In October 2026 that, together with PrismNRI's CI on the same account, spent the Free
# plan's whole monthly Actions allowance — $12, which is 2,000 Linux minutes at $0.006 — in two
# days, and GitHub refused the last job of the last run. GitHub's own usage report said where it
# went: a macOS minute costs $0.062, ten times a Linux one, and macOS was 15% of the minutes and 57%
# of the money; and a third of this repository's runs were repeats on main of code its branch had
# just passed. So:
#
#   * Pull requests, not pushes. A pull_request run tests the merge result, which is what main
#     becomes, once per push to the pull request, and nothing re-runs on main after the merge. A
#     branch with no pull request is not built; open a draft to get a run.
#   * macOS on demand. The osx-arm64 leg is about three quarters of a run's cost, and macOS is not
#     an engine target yet, so it runs when asked — a manual run of this workflow includes it by
#     default — and before every release, where publish.yml calls this workflow with it on. A
#     Windows or Linux regression still fails the pull request; an osx-arm64-only one is caught
#     before it ships rather than before it merges.
#   * The check that the generated bindings are current moved to regen.yml, which runs only when
#     what it checks can have changed.
#
# Per run at October 2026 prices, measured from the jobs' durations: about $0.50 with macOS, about
# $0.14 without. Caches are scoped to the pull request, so its first run downloads the Slang
# release and the PrismNRI packages afresh — seconds per leg, not minutes.
#
# The cross-platform matrix is not box-ticking: the first linux-x64 run of this project found a
# heap-corrupting ownership bug that had been passing green on Windows since the first commit
# (ISession::loadModule* returns a borrowed pointer — see docs/guide.md ). glibc
# aborts on it; the Windows heap does not. Keeping Linux in the matrix is the control for that
# entire class of bug — and it has paid twice: 's fifth Slang crash returns null on Windows
# and segfaults on Linux, and was found by this leg aborting a run that was green here.
#
# linux-arm64 and osx-arm64 are the third and fourth legs, each added for an axis the others do
# not cover. See the matrix.
#
# The native payload is NOT committed — runtimes/ is gitignored. Each job fetches it from the
# release pinned in Directory.Build.props, which also proves the fetch script still works against
# the current upstream layout.

# Markdown-only changes skip all of this and run docs.yml instead. A full run is four runners each
# downloading a 36 MB payload, building, and executing 520 tests, plus a job that installs ClangSharp
# and regenerates the bindings — none of which a paragraph can affect.
#
# paths-ignore only skips when *every* changed file matches, so a commit touching a document and a
# source file still runs everything. That is the behaviour worth having: the docs here are not inert
# prose, they carry section numbers that code comments cite, and check-docs.sh verifies those
# against the source rather than against the documents alone.
#
# If these jobs are ever made required status checks, this needs revisiting: a skipped workflow
# never reports, and a PR waits forever for a check that will not arrive.
on:
  pull_request:
    paths-ignore: ['**.md']
  # A manual run is a deliberate one, so it is the full matrix unless told otherwise. Run it on a
  # branch to put macOS in front of a change that might need it.
  workflow_dispatch:
    inputs:
      macos:
        description: 'Include the osx-arm64 leg'
        type: boolean
        default: true
  # publish.yml calls this before it packs anything, with macOS on: every RID a package ships is
  # tested by the run that publishes it.
  workflow_call:
    inputs:
      macos:
        type: boolean
        default: true

permissions:
  contents: read

# A newer push to the same pull request supersedes the run in flight. Without this, a fixup pushed
# while the previous commit is still being tested means two full matrices, and when the earlier
# one is hung (see the Test step's timeout) it means a runner held for nothing.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.rid }})
    # The runner for each RID, in one place so the matrix can be a plain list of RIDs whose length
    # depends on whether macOS was asked for.
    #
    # linux-x64 is pinned to ubuntu-24.04 rather than ubuntu-latest, which GitHub moves to Ubuntu 26
    # from October 19, 2026. The lavapipe step installs Mesa and the validation layers by package
    # name and checks a manifest path, and the allocator-poisoning notes on the Test step are
    # measurements of glibc 2.39; an image change is a bad thing to discover on a run that was
    # meant to test something else. Move the pin deliberately, and re-measure those when it moves.
    #
    # arm64, and not for completeness. Two things here are architecture-sensitive and had never
    # been executed on one: every vtable call in the generated layer is
    # `delegate* unmanaged[Stdcall]`, and stdcall has no meaning on ARM64 — the runtime is expected
    # to ignore it and fall back to the platform convention. So are the [UnmanagedCallersOnly]
    # thunks Slang calls back into. "Expected to" is the phrase this project has learned to measure.
    # Slang publishes slang-<version>-linux-aarch64.zip and fetch-native.ps1 already maps it.
    #
    # macOS, when it runs. Until that leg existed, publish.yml staged an osx-arm64 payload into
    # every package and nothing had ever loaded it — a library shipped to a platform on the
    # strength of the RID being spelled correctly. macos-14 is Apple Silicon, so the ARM64 half was
    # already answered by linux-arm64; what is new is the OS: a third allocator, a third dynamic
    # loader, and the Itanium C++ ABI on a runtime that is not glibc's. No Vulkan there:
    # VulkanTestDevice finds no loader and the validation tests skip with their reason.
    runs-on: ${{ fromJSON('{"win-x64":"windows-latest","linux-x64":"ubuntu-24.04","linux-arm64":"ubuntu-24.04-arm","osx-arm64":"macos-14"}')[matrix.rid] }}
    strategy:
      fail-fast: false       # a Windows-only or Linux-only failure is the interesting signal
      matrix:
        # osx-arm64 only when asked for: a manual run (on by default) or a release. On a pull
        # request `inputs` is empty, so the expression takes the three-leg list.
        rid: ${{ fromJSON(inputs.macos && '["win-x64","linux-x64","linux-arm64","osx-arm64"]' || '["win-x64","linux-x64","linux-arm64"]') }}

    steps:
      - uses: actions/checkout@v4

      # The preview quality is there because .NET 11 has no GA release yet; drop it when it does.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: preview

      - name: Cache the Slang release
        uses: actions/cache@v4
        with:
          # Keyed on the pin, so a version bump misses the cache and re-downloads by design.
          path: obj/slang-dist
          key: slang-${{ matrix.rid }}-${{ hashFiles('Directory.Build.props') }}

      # slang.h, and Slang's own tests/reflection corpus. Both are fetched from the pinned tag by
      # the tests themselves on first use — SlangHeader and SlangTestCorpus — so this only saves
      # the download. Keyed on the pin like the payload above, so a version bump refetches.
      #
      # Worth caching for a second reason: the corpus listing goes through the GitHub API, which
      # allows 60 unauthenticated requests an hour per IP. Four legs on shared runner IPs is not a
      # comfortable margin, and SlangTestCorpus fails loudly rather than running a subset. The
      # margin ran out on the first .NET 11 push: the caches had been evicted after a quiet week
      # on main, and two legs out of eight got a 403 on their very first call. So the test step
      # now hands the job token to the tests, which makes a cache miss a cost rather than a
      # failure; this cache remains the reason the budget is rarely touched at all.
      - name: Cache the pinned headers and Slang's test corpus
        uses: actions/cache@v4
        with:
          path: |
            obj/slang-headers
            obj/slang-tests
          key: slang-sources-${{ hashFiles('Directory.Build.props') }}

      - name: Fetch native payload
        shell: pwsh
        run: ./tools/fetch-native.ps1 -Rid ${{ matrix.rid }} -Profile Spirv

      # Keyed on the pin like the caches above, so a PrismNRI bump misses and refetches. Not keyed
      # on the RID: the packages are the same bytes on every leg, with every RID's native inside.
      # fetch-nri.ps1 skips packages already present, so a hit means the step below makes no API
      # call and never needs the token.
      - name: Cache the PrismNRI packages
        uses: actions/cache@v4
        with:
          path: nupkg-feed/*.nupkg
          key: prismnri-${{ hashFiles('Directory.Build.props') }}

      # Into the folder feed nuget.config names, nupkg-feed/. PrismNRI is a private repository, so
      # a fine-grained PAT with read access to its contents (Contents: read) is stored on THIS
      # repository as the secret PRISMNRI_READ_TOKEN. The job's own GITHUB_TOKEN cannot stand in:
      # it is scoped to the repository the workflow runs in, and another repository's release
      # assets are outside that scope whatever `permissions:` says.
      - name: Fetch the PrismNRI packages
        shell: pwsh
        env:
          PRISMNRI_TOKEN: ${{ secrets.PRISMNRI_READ_TOKEN }}
        run: ./tools/fetch-nri.ps1

      - name: Payload carries the SPIR-V optimiser
        shell: pwsh
        run: |
          # slang-glslang is where spirv-opt lives. Without it Slang emits unoptimised SPIR-V —
          # ~23% larger — and says so once per global session, on a *successful* result, so the
          # rest of a batch is silently oversized. DownstreamCompilerTests asserts the same thing
          # from inside the process; this catches a staging regression before anything is built.
          $dir = "runtimes/${{ matrix.rid }}/native"
          $found = @(Get-ChildItem $dir -File | Where-Object { $_.Name -like '*slang-glslang*' })
          if ($found.Count -eq 0) {
            throw "no slang-glslang in $dir - every shader would compile unoptimised"
          }
          $found | ForEach-Object { Write-Host ("    {0,-44} {1,8:N1} MB" -f $_.Name, ($_.Length / 1MB)) }

      # A software Vulkan implementation and the validation layers, so VulkanValidationTests runs
      # rather than skipping. Those tests build real descriptor set layouts, a real pipeline layout
      # and a real VkPipeline out of the projection and let Khronos judge the result — the only
      # oracle in the suite that is not ultimately Slang telling us about itself (docs ).
      #
      # Linux only. A Windows runner has no GPU either, but getting the layers there means the SDK
      # installer, which is a large download for the same three tests these already cover; on
      # Windows they skip, with the reason printed.
      #
      # mesa-vulkan-drivers carries lavapipe. No VK_DRIVER_FILES is set: it is the only ICD on the
      # runner, so the loader's own discovery finds it, and pinning a path is how this breaks —
      # Mesa renamed the file from lvp_icd.x86_64.json to lvp_icd.json between the version in
      # Ubuntu 24.04's archive and the one in its updates.
      - name: Install lavapipe and the Vulkan validation layers
        if: startsWith(matrix.rid, 'linux')
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mesa-vulkan-drivers vulkan-validationlayers libvulkan1
          echo "ICDs:";   ls -1 /usr/share/vulkan/icd.d/
          echo "layers:"; ls -1 /usr/share/vulkan/explicit_layer.d/
          test -f /usr/share/vulkan/explicit_layer.d/VkLayer_khronos_validation.json \
            || { echo "::error::validation layer manifest missing"; exit 1; }

      # A newer Khronos layer in front of Ubuntu's, on linux-x64, for the NRI device tests.
      #
      # Ubuntu 24.04's vulkan-validationlayers is 1.3.275, and LunarG's apt repository stops at
      # 1.4.313. NRI is built against newer Vulkan headers and chains every structure and extension
      # the driver offers into vkCreateDevice, and a layer older than those headers reports each one
      # it does not know as an ERROR. Measured under WSL on the Mesa 25.2.8 lavapipe this runner
      # installs, the 33 Vulkan rows of NriDeviceTests that create a device, with each layer:
      #
      #   1.3.275   all 33 failed, before the projection was looked at, on
      #             VUID-VkDeviceCreateInfo-pNext-pNext and VUID-VkPhysicalDeviceProperties2-pNext-pNext.
      #   1.4.313   all 33 again, on VK_EXT_zero_initialize_device_memory (VkStructureType
      #             1000620000), which that layer predates.
      #   1.4.363   none failed on device creation.
      #
      # PrismNRI's own Linux job takes this layer the same way, for the same reason. The only
      # current Linux binary is inside LunarG's SDK tarball (366 MB), so the library and its
      # manifest are taken out of it once per version and cached; the loader stays Ubuntu's.
      #
      # VK_ADD_LAYER_PATH puts it ahead of the system layer for every later step, so the Vortice
      # tests (VulkanValidationTests, VulkanCorpusValidationTests, SlangComputeCorpusTests) are
      # judged by it on this leg too — one layer per leg, the newer one, which knows more rules.
      # Measured that way under WSL on Slang 2026.21: the whole suite passed with it in front (740,
      # 12 skipped, none for the layer), and the validation-layer gate below still counts 5.
      # linux-arm64 keeps Ubuntu's: the tarball is x86_64 only, and that leg runs no NRI device
      # test. The version is in the cache key and the fetch step; move them together.
      - name: Cache the Khronos validation layer
        if: matrix.rid == 'linux-x64'
        id: vvl
        uses: actions/cache@v4
        with:
          path: obj/vvl
          key: vvl-linux-x64-1.4.363.0

      - name: Fetch the Khronos validation layer
        if: matrix.rid == 'linux-x64' && steps.vvl.outputs.cache-hit != 'true'
        env:
          VVL_VERSION: 1.4.363.0
          # Of vulkansdk-linux-x86_64-1.4.363.0.tar.xz, measured when this was written. A changed
          # tarball under the same version is a reason to look before trusting it.
          VVL_SHA256: 197962f5cbf80baf2775a03336a01cee7c8745686c65aaa70d3f751ade4d7e43
        run: |
          tmp="$(mktemp -d)"
          curl -fsSL -o "$tmp/sdk.tar.xz" \
            "https://sdk.lunarg.com/sdk/download/$VVL_VERSION/linux/vulkansdk-linux-x86_64-$VVL_VERSION.tar.xz"
          echo "$VVL_SHA256  $tmp/sdk.tar.xz" | sha256sum -c -
          tar -xJf "$tmp/sdk.tar.xz" -C "$tmp" --wildcards \
            "*/x86_64/lib/libVkLayer_khronos_validation.so" \
            "*/x86_64/share/vulkan/explicit_layer.d/VkLayer_khronos_validation.json"
          # The manifest names its library as ../../../lib/, so the layout is kept.
          mkdir -p obj/vvl/lib obj/vvl/share/vulkan/explicit_layer.d
          cp "$tmp/$VVL_VERSION/x86_64/lib/libVkLayer_khronos_validation.so" obj/vvl/lib/
          cp "$tmp/$VVL_VERSION/x86_64/share/vulkan/explicit_layer.d/VkLayer_khronos_validation.json" \
            obj/vvl/share/vulkan/explicit_layer.d/
          strip --strip-unneeded obj/vvl/lib/libVkLayer_khronos_validation.so
          rm -rf "$tmp"

      - name: Put the Khronos validation layer in front of Ubuntu's
        if: matrix.rid == 'linux-x64'
        run: |
          grep -o '"api_version": "[^"]*"' obj/vvl/share/vulkan/explicit_layer.d/VkLayer_khronos_validation.json
          echo "VK_ADD_LAYER_PATH=$GITHUB_WORKSPACE/obj/vvl/share/vulkan/explicit_layer.d" >> "$GITHUB_ENV"

      # Also runs in docs.yml, which is what covers a markdown-only change. It runs here too because
      # two of its three checks are broken by changes that touch no markdown at all: a § renumbered
      # in a code comment, and a file renamed out from under PrismSlang.slnx. Linux only — it is a
      # property of the tree, not of the platform.
      - name: Check documentation and solution references
        if: matrix.rid == 'linux-x64'
        run: bash tools/ci/check-docs.sh

      - name: Build
        run: dotnet build PrismSlang.slnx -c Release --nologo -warnaserror

      # MALLOC_PERTURB_ makes the allocator the assertion, on every test rather than the few that
      # were written to look for it. glibc fills freshly malloc'd memory with the complement of the
      # byte and freed memory with the byte itself, so a use-after-free reads 0xa5a5a5a5a5a5a5a5 —
      # non-canonical on x86-64, therefore a segfault the moment it is dereferenced as a pointer —
      # instead of the stale-but-intact data that makes these bugs pass. Both bugs in  lived on
      # paths LifetimeTests had no reason to walk; this covers all 393.
      #
      # Set unconditionally rather than gated on the RID: MALLOC_PERTURB_ is a glibc variable, so
      # Windows and macOS ignore it, and a conditional would be more machinery than the thing it
      # configures.
      #
      # macOS has its own pair — MallocScribble fills freed memory with 0x55, MallocPreScribble
      # fills fresh allocations with 0xAA — and they are back on, which they were not for three
      # runs. The history is the point.
      #
      # They were set for the first two osx-arm64 runs and both crashed the test host. That proved
      # nothing: the macOS leg and aggressive allocator poisoning arrived in the same commit, so a
      # crash could not be attributed to either. Poisoning is *designed* to turn a latent read of
      # freed or uninitialized memory into a fault, and Slang is a large C++ codebase running under
      # an allocator that had never poisoned it — "the platform is broken" and "the poisoning found
      # something real" look identical from here. So they came off, one variable at a time.
      #
      # The baseline they were waiting for now exists. osx-arm64 is green without them (a0eb587,
      # 470 passed), after the two ownership bugs the leg found —  — were fixed. Any
      # crash from here is attributable to the poisoning, and unlike last time there is somewhere
      # to look: tools/ci/macos-backtrace.sh runs on failure and produces a stack.
      #
      # Set unconditionally alongside MALLOC_PERTURB_. glibc and Windows ignore these two exactly as
      # macOS ignores that one, and a conditional would be more machinery than the thing it
      # configures.
      #
      # GLIBC_TUNABLES and MallocNanoZone are here because the poisoning was half-armed and nobody
      # had checked. Both allocators have a fast path that skips it: glibc's `_int_free` returns via
      # the tcache before it reaches `free_perturb`, and Apple's nano zone does not implement the
      # scribble options at all. Measured on linux-x64, MALLOC_PERTURB_ alone poisons a 4 KB block
      # and leaves a 64 B one untouched — and 64 bytes is the size an AST node is. Disabling the
      # tcache arms it for both and costs about 6% on a compile-heavy workload, which is nothing for
      # the coverage. MallocNanoZone=0 is the same move on macOS and is *not* yet confirmed; the
      # prober reports what it measured either way.
      #
      # MALLOC_CHECK_=3 is the usual companion and is deliberately absent. Measured on glibc 2.39,
      # which is what ubuntu-latest ships: it is ignored unless libc_malloc_debug.so.0 is
      # LD_PRELOADed, because glibc 2.34 moved that checking out of libc — so the obvious spelling
      # is a no-op that looks like coverage. Preloading it is worse than nothing: with the debug
      # allocator installed, a one-chunk heap overflow that plain glibc 2.39 aborts on ran to
      # completion and exited 0. The default hardening is what caught the double free in , and
      # MALLOC_CHECK_ would have replaced it with something weaker.
      - name: Test
        # The suite takes two to four minutes on every leg. Without a bound, a hang holds the
        # runner for the six-hour default: the push-triggered win-x64 run of the .NET 11 migration
        # went quiet one minute in, on a commit whose other run had finished in under three, and
        # was cancelled by hand at twenty-two. The bound turns the next one into a failure with
        # the --blame sequence file intact, which the step below reads to name the test.
        timeout-minutes: 20
        env:
          # For SlangTestCorpus's one GitHub API call, so a cache miss does not spend the runner
          # IP's unauthenticated budget — see the cache step above. Read-only on this repository
          # and ignored by every other test.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MALLOC_PERTURB_: 165
          GLIBC_TUNABLES: glibc.malloc.tcache_count=0
          MallocScribble: 1
          MallocPreScribble: 1
          MallocNanoZone: 0
        # --blame writes a Sequence.xml naming the test that was executing when the host died, and
        # deletes it again if the run completes — so it costs nothing on a green run and is the
        # difference between knowing the crasher and inferring it from test ordering on a different
        # platform. Reached for after two macOS runs were diagnosed by guesswork; it is the tool
        # that exists for this and should have been the first move.
        run: dotnet test PrismSlang.slnx -c Release --no-build --nologo --blame --logger "trx;LogFileName=results.trx"

      # A skipped test is green, so installing lavapipe and never noticing it failed to load would
      # leave the whole validation harness silently switched off. Two of the three run on any
      # device; the third needs 64-bit vertex formats, which lavapipe does not offer, and skips
      # with that reason.
      # Both linux legs, and both fatal. arm64 reported through `::notice::` instead for its first
      # runs, because a build going red over lavapipe being unavailable on a new runner would have
      # been red for a reason unrelated to the port.
      #
      # It has now answered: `##[notice]2 validation-layer test(s) ran against lavapipe on
      # linux-arm64` (a0eb587), with the same `lvp_icd.json` and the same 2-of-3 as linux-x64 — the
      # third needs 64-bit vertex formats lavapipe does not offer and skips with that reason. So the
      # gate is armed on both.
      #
      # That order was the point. A gate turned on before anyone has watched it work is the failure
      # mode  is about, and a gate that can never fail is the one 's driver was.
      - name: The validation-layer tests actually ran
        if: startsWith(matrix.rid, 'linux')
        env:
          MALLOC_PERTURB_: 165
        run: |
          # The count comes from the TRX, not from the console. The first version of this step
          # scraped the one-line "Passed!  - Failed: 0, Passed: 2, ..." summary, which is what the
          # default console logger prints — and then gained a
          # `--logger "console;verbosity=detailed"` for a better log, which prints a multi-line
          # block instead and no such line at all. It reported "only 0 ran" on a run where two had
          # passed. TRX has a <Counters> element and does not change shape to suit a verbosity.
          #
          # The detailed console logger stays, because it is what puts the skip reason in the log.
          # SlangComputeCorpusTests is here too, and needs the same device. It is the only thing
          # in the suite that executes a shader — 51 of Slang's own compute tests dispatched with
          # buffers bound where reflection says, compared against the words upstream recorded — so
          # if lavapipe is missing, the check that offsets and binding indices actually work goes
          # quiet along with the layers.
          dotnet test PrismSlang.slnx -c Release --no-build --nologo \
            --filter "FullyQualifiedName~VulkanValidationTests|FullyQualifiedName~SlangComputeCorpusTests" \
            --logger "console;verbosity=detailed" \
            --logger "trx;LogFileName=vulkan.trx" \
            --results-directory vulkan-results

          counters=$(grep -o '<Counters [^>]*>' vulkan-results/vulkan.trx | head -1)
          echo "$counters"
          passed=$(echo "$counters" | sed -n 's/.*[^a-z]passed="\([0-9]*\)".*/\1/p')

          if [ "${passed:-0}" -lt 5 ]; then
            echo "::error::only ${passed:-0} device-backed test(s) ran on ${{ matrix.rid }}. lavapipe or the layers did not load, so the only oracle in the suite that is not Slang judging itself is switched off, and nothing dispatches a shader; the skip reason is in the output above."
            exit 1
          fi

          echo "::notice::$passed device-backed test(s) ran against lavapipe on ${{ matrix.rid }}"

      # The same gate as above, for the two oracles added after it, and for the same reason: both
      # skip rather than fail when what they need is missing, and a skipped test is green.
      #
      #   NativeAbiTests needs a C++ compiler. Every runner has one — clang++ on the Linux and
      #   macOS images, LLVM at its default install path on Windows — so a skip here means the
      #   image changed, not that the check is unavailable. Without it, nothing compares the
      #   binding's struct layout, field offsets, bitfield packing or 278 DllImport signatures
      #   against the header, and none of those failures are visible any other way.
      #
      #   SlangReflectionCorpusTests and SlangWalkerCorpusTests need the corpus download. They are
      #   [NativeFact]s, so they also skip when the payload does not load — which the Tier 0 spike
      #   below catches, but only after these have quietly reported nothing.
      #
      # Counted from the TRX rather than the console summary, for the reason the step above
      # records: the console logger changes shape with its verbosity and the TRX does not.
      - name: The header-derived and corpus oracles actually ran
        # Every leg, unlike the lavapipe gate above, so `shell: bash` is explicit — a Windows
        # runner defaults to pwsh and would read the script below as PowerShell.
        shell: bash
        env:
          MALLOC_PERTURB_: 165
        run: |
          dotnet test PrismSlang.slnx -c Release --no-build --nologo \
            --filter "FullyQualifiedName~NativeAbiTests|FullyQualifiedName~SlangReflectionCorpusTests|FullyQualifiedName~SlangWalkerCorpusTests|FullyQualifiedName~VtableOrderTests" \
            --logger "console;verbosity=detailed" \
            --logger "trx;LogFileName=oracles.trx" \
            --results-directory oracle-results

          counters=$(grep -o '<Counters [^>]*>' oracle-results/oracles.trx | head -1)
          echo "$counters"
          passed=$(echo "$counters"  | sed -n 's/.*[^a-z]passed="\([0-9]*\)".*/\1/p')
          skipped=$(echo "$counters" | sed -n 's/.*[^a-z]notExecuted="\([0-9]*\)".*/\1/p')

          if [ "${skipped:-0}" -ne 0 ]; then
            echo "::error::${skipped} of the header and corpus checks skipped on ${{ matrix.rid }}. The reason is printed above; each one is an oracle that is now switched off while reporting green."
            exit 1
          fi

          if [ "${passed:-0}" -lt 14 ]; then
            echo "::error::only ${passed:-0} header/corpus checks ran on ${{ matrix.rid }}; expected at least 14."
            exit 1
          fi

          echo "::notice::$passed header and corpus checks ran on ${{ matrix.rid }}, none skipped"

      # The same gate again, for NriDeviceTests, and for the same reason: every test in it skips
      # rather than fails when NRI.dll does not load or a backend is missing, and a skipped test is
      # green. A PrismNRI package that restores without its native payload would otherwise turn
      # the whole class off on a run that reports success.
      #
      # This step counts win-x64 and the next one linux-x64, the two legs the NRI device tests run
      # on (tests/PrismSlang.Tests/NriFact.cs). On linux-arm64 every one of them skips because the
      # PrismNRI package has no payload for it, and on osx-arm64 by decision, since macOS is not an
      # engine target yet; each says so in its skip reason.
      #
      # What is counted is NONE and D3D12. Hosted Windows has no Vulkan driver, so the tests gated
      # on NRI's Vulkan backend (the 33-case pipeline theory, which xunit reports as one skipped
      # row, and the two dispatches: 3 skipped in the TRX) skip here; linux-x64 runs them over
      # lavapipe and counts them (the next step).
      # It does have WARP, which NriTestDevice picks under GITHUB_ACTIONS, and PrismNRI's own
      # win-x64 job runs its D3D12 suite there with the debug layer — so the D3D12 leg, compiled to
      # DXIL with dxc copied beside the compiler from Microsoft.Direct3D.DXC, runs here. On this leg exactly these must pass:
      #
      #   33  A_pipeline_layout_built_from_the_projection_is_accepted_by_the_none_backend, one
      #       per corpus case: 31 layouts created through PrismNRI's marshalling, and the two
      #       projection refusals (descriptor-kinds, wide-vertex-inputs) asserted by name.
      #    1  Projected_vertex_formats_agree_with_nris_own_vulkan_conversion_table, a NONE fact
      #       because nriConvertNRIFormatToVK is a static table in NRI.dll and needs no device.
      #    1  Every_declared_refusal_and_exclusion_names_a_shader_that_exists, a plain fact.
      #   33  A_pipeline_built_from_the_dxil_projection_passes_d3d12_validation, one per corpus
      #       case: 25 cases whose pipelines are built and accepted, 5 layouts built with the pipeline out of reach
      #       (mesh, amplification, ray-tracing, tessellation, geometry), the combined-sampler
      #       refusal, and the two shaders dxc will not compile. The four projection defects this
      #       leg found on its first run are fixed and build with the rest (NriDeviceTests.cs).
      #    2  The D3D12 dispatches: compute-fixed through a descriptor, and a constant buffer
      #       promoted to root constants by RootConstantParameters, both read back.
      #
      # 70. Measured with PRISMNRI_TEST_SOFTWARE=1 on a workstation, which makes NriTestDevice pick
      # WARP ("Microsoft Basic Render Driver") for D3D12 the way the runner does: every D3D12 row
      # passed, with outcomes identical to the RTX 4070 SUPER case for case — WARP reports mesh
      # shaders and a ray tracing tier, so even the mesh, amplification and ray-tracing layouts
      # are built on it — and the same messages, error for error and warning for warning.
      #
      # The threshold is that exact count rather than a looser floor: if NRI.dll stops loading, 67
      # of the 68 skip and the plain fact alone passes; if the D3D12 device or dxc goes missing, the
      # 34 D3D12 rows skip and 34 pass, which a floor of "some" would let by. A new corpus case adds
      # a row to two theories, so the count only grows; raise it by two then.
      - name: The NRI device tests actually ran
        if: matrix.rid == 'win-x64'
        shell: bash
        run: |
          dotnet test PrismSlang.slnx -c Release --no-build --nologo \
            --filter "FullyQualifiedName~NriDeviceTests" \
            --logger "console;verbosity=detailed" \
            --logger "trx;LogFileName=nri.trx" \
            --results-directory nri-results

          counters=$(grep -o '<Counters [^>]*>' nri-results/nri.trx | head -1)
          echo "$counters"
          passed=$(echo "$counters" | sed -n 's/.*[^a-z]passed="\([0-9]*\)".*/\1/p')

          if [ "${passed:-0}" -lt 70 ]; then
            echo "::error::only ${passed:-0} NRI device test(s) passed on ${{ matrix.rid }}; expected at least 70 (35 on the NONE backend, 35 on D3D12 over WARP). NRI.dll did not load, the NONE or D3D12 device could not be created, or dxc was not staged, so something that checks what PrismNRI and D3D12 accept from the projection is switched off; the skip reason is in the output above."
            exit 1
          fi

          echo "::notice::$passed NRI device test(s) ran on ${{ matrix.rid }} (NONE and D3D12 on WARP; the Vulkan-backed ones skip on hosted runners)"

      # The same gate for linux-x64, as its own step rather than a per-RID number in the one above:
      # the two legs count different backends, fail for different reasons, and each count is
      # derived on its own. What is counted here is NONE and Vulkan, on lavapipe, validated by the
      # SDK's 1.4.363 layer the steps after the apt install put in front of Ubuntu's.
      #
      # D3D12 does not exist on Linux: its 3 TRX rows (the 33-case theory as one row, and two
      # facts) skip with NriTestDevice's own "D3D12 is Windows only". On this leg exactly these
      # must pass:
      #
      #   33  A_pipeline_layout_built_from_the_projection_is_accepted_by_the_none_backend, one
      #       per corpus case, as on win-x64.
      #    1  Projected_vertex_formats_agree_with_nris_own_vulkan_conversion_table, NRI's static
      #       format table in libNRI.so.
      #    1  Every_declared_refusal_and_exclusion_names_a_shader_that_exists, a plain fact.
      #   33  A_pipeline_built_from_the_projection_passes_nri_and_vulkan_validation, one per corpus
      #       case: 25 whose pipelines are built and accepted, 6 layouts built with the pipeline out
      #       of reach (mesh, amplification, ray-tracing, tessellation, geometry, subpass-inputs),
      #       and the two projection refusals. No layout is excused by NriDeviceTests' device
      #       limits: Mesa 25.2.8's lavapipe reports mesh shaders and ray tracing.
      #    2  The Vulkan dispatches: compute-fixed through a descriptor, and a push-constant block
      #       projected to root constants, both read back.
      #
      # 70, of 73 rows, with 3 skipped. Measured under WSL on Ubuntu 24.04 with the Mesa 25.2.8
      # lavapipe this runner installs, the Slang 2026.21 linux-x64 payload, PRISMNRI_TEST_SOFTWARE=1
      # (the software device GITHUB_ACTIONS selects) and the Test step's allocator settings, with
      # the layer applied as here — VK_ADD_LAYER_PATH alone, over a system layer — and the loader's
      # own log (VK_LOADER_DEBUG=layer) and the test host's memory map both showing the 1.4.363
      # library loaded rather than the system one. No validation message at all, error or warning.
      #
      # Exact rather than a floor, because each way this goes quiet is a different count:
      #   1   libNRI.so stops loading: every gated row skips and the plain fact alone passes.
      #   35  lavapipe or libvulkan goes missing, or the layer above is not in front: the Vulkan
      #       rows skip, with NriTestDevice's reason or, for an older layer, NriFact's, which quotes
      #       the layer's own "unknown VkStructureType" error about NRI's device creation. Measured
      #       with Ubuntu's 1.3.275 alone: 35 passed, 6 skipped.
      # A layer that rejects something the projection said fails a test, and the step with it. A
      # new corpus case adds a row to two theories here; raise it by two then.
      - name: The NRI device tests actually ran (linux-x64)
        if: matrix.rid == 'linux-x64'
        env:
          MALLOC_PERTURB_: 165
        run: |
          dotnet test PrismSlang.slnx -c Release --no-build --nologo \
            --filter "FullyQualifiedName~NriDeviceTests" \
            --logger "console;verbosity=detailed" \
            --logger "trx;LogFileName=nri.trx" \
            --results-directory nri-results

          counters=$(grep -o '<Counters [^>]*>' nri-results/nri.trx | head -1)
          echo "$counters"
          passed=$(echo "$counters" | sed -n 's/.*[^a-z]passed="\([0-9]*\)".*/\1/p')

          if [ "${passed:-0}" -lt 70 ]; then
            echo "::error::only ${passed:-0} NRI device test(s) passed on ${{ matrix.rid }}; expected at least 70 (35 on the NONE backend, 35 on Vulkan over lavapipe). libNRI.so did not load, lavapipe or libvulkan is missing, or the 1.4.363 validation layer is not in front of Ubuntu's, so something that checks what PrismNRI and Vulkan accept from the projection is switched off; the skip reason is in the output above."
            exit 1
          fi

          echo "::notice::$passed NRI device test(s) ran on ${{ matrix.rid }} (NONE, and Vulkan on lavapipe with the 1.4.363 layer; D3D12 does not exist here)"

      # And DxilTests, for dxc itself: every test there is a [DxcFact] or [DxcTheory] and skips
      # when dxc is not loadable, which is the right behaviour on the legs that never stage it and
      # exactly the wrong one here. If the test project stops copying dxcompiler.dll beside
      # slang-compiler (its Microsoft.Direct3D.DXC reference and its import of the dxc targets
      # file), the DXIL compile, projection and baking checks would all go quiet on a green run.
      # The NRI gate above would catch the D3D12 half; this catches the half that needs no device.
      # Neither would notice dxil.dll going missing, and neither needs to: the pinned dxc never
      # loads it (DxilTests says what was measured).
      #
      # 74, and no skip at all, measured on a workstation with dxc staged by the same package:
      #
      #   33  Every_corpus_entry_point_compiles_to_a_signed_dxil_container, one per corpus case:
      #       31 cases whose every container has a non-zero digest (so a validator signed them: the
      #       one built into dxcompiler.dll, since this dxc does not load dxil.dll), and the two dxc
      #       refusals (subpass-inputs, wide-vertex-inputs) asserted by dxc's own words.
      #   33  The_dxil_projection_accepts_what_the_spirv_one_does_and_reads_registers.
      #    8  facts: the session with dxc, the session without it (which returns early here, and is
      #       measured on the Linux and macOS legs, where no dxc is staged), the exception lists,
      #       the borrowed range names, the push-constant promotion, the texture refusal, the
      #       space-0 constant buffer defect, and a baked DXIL package round-tripped through a file.
      #
      # Skips are counted as well as passes, because here a skip has only one cause.
      - name: The DXIL tests actually ran
        if: matrix.rid == 'win-x64'
        shell: bash
        run: |
          dotnet test PrismSlang.slnx -c Release --no-build --nologo \
            --filter "FullyQualifiedName~DxilTests" \
            --logger "console;verbosity=detailed" \
            --logger "trx;LogFileName=dxil.trx" \
            --results-directory dxil-results

          counters=$(grep -o '<Counters [^>]*>' dxil-results/dxil.trx | head -1)
          echo "$counters"
          passed=$(echo "$counters"  | sed -n 's/.*[^a-z]passed="\([0-9]*\)".*/\1/p')
          skipped=$(echo "$counters" | sed -n 's/.*[^a-z]notExecuted="\([0-9]*\)".*/\1/p')

          if [ "${skipped:-0}" -ne 0 ]; then
            echo "::error::${skipped} DXIL test(s) skipped on ${{ matrix.rid }}. dxc is not loadable beside slang-compiler, so nothing checks that the corpus compiles to DXIL or what the projection makes of a DXIL layout; the skip reason is in the output above."
            exit 1
          fi

          if [ "${passed:-0}" -lt 74 ]; then
            echo "::error::only ${passed:-0} DXIL test(s) passed on ${{ matrix.rid }}; expected at least 74."
            exit 1
          fi

          echo "::notice::$passed DXIL test(s) ran on ${{ matrix.rid }}, none skipped"

      # Also the loadability gate, and on a new platform that is the job that matters most. Almost
      # every test is a [NativeFact], which *skips* when slang-compiler cannot be loaded — so a
      # payload that stages correctly and then refuses to load produces a green run with four
      # hundred silent skips. The spike has no skip logic: it calls SlangGlobalSession.Create
      # directly, and a DllNotFoundException there fails the step.
      - name: Tier 0 spike
        env:
          MALLOC_PERTURB_: 165
          GLIBC_TUNABLES: glibc.malloc.tcache_count=0
          MallocScribble: 1
          MallocPreScribble: 1
          MallocNanoZone: 0
        run: dotnet run --project samples/PrismSlang.Smoke -c Release --no-build

      # A test-host crash reports whatever was on stderr as its "reason", which is never the cause:
      # the first macOS run blamed a Slang warning about an uninitialized variable in a module three
      # test classes earlier. The TRX records every test that *completed*, so the last few are where
      # the crasher is, and printing them beats downloading an artifact to find out.
      #
      # Runs only on failure, so it costs nothing on a green run, and it is worth having on every
      # leg: two of the three crashes in docs/guide.md were found by a host dying on one platform
      # and not another.
      - name: If the host crashed, name the last tests that ran
        if: failure()
        shell: pwsh
        run: |
          # --blame's sequence file names the test that was executing when the host died — or when
          # the step's timeout killed it. It only exists when the run did not finish, which is
          # exactly when it is wanted, and it is read before the TRX because a timed-out run has no
          # TRX at all: the logger writes that file at the end, and the first win-x64 hang on .NET
          # 11 was cancelled with twenty minutes of silence and nothing to say which test it was in.
          $seq = Get-ChildItem -Recurse -Filter '*.Sequence.xml' -ErrorAction SilentlyContinue |
                 Select-Object -First 1
          if ($seq) {
            Write-Host "=== the host died, or was killed, during:"
            ([xml](Get-Content $seq.FullName)).TestSequence.Test |
              ForEach-Object { Write-Host ("    {0}.{1}" -f $_.source, $_.fullyQualifiedName) }
            Write-Host ""
          } else {
            Write-Host "no --blame sequence file: the host did not crash, or did not get that far."
          }

          $trx = Get-ChildItem -Recurse -Filter results.trx -ErrorAction SilentlyContinue |
                 Select-Object -First 1
          if (-not $trx) { Write-Host "no TRX — the run did not get that far"; exit 0 }

          [xml]$doc = Get-Content $trx.FullName
          $ns = @{ t = 'http://microsoft.com/schemas/VisualStudio/TeamTest/2010' }
          $results = Select-Xml -Xml $doc -Namespace $ns -XPath '//t:UnitTestResult' |
                     ForEach-Object { $_.Node }

          Write-Host "=== $($results.Count) test(s) completed. The last 15, in finish order:"
          $results |
            Sort-Object { [datetime]$_.endTime } |
            Select-Object -Last 15 |
            ForEach-Object { Write-Host ("    {0,-8} {1}" -f $_.outcome, $_.testName) }

          # Ordering differs between platforms, so a per-class tally says which class was mid-flight
          # in a way a tail of the list cannot.
          Write-Host ""
          Write-Host "=== completed per class:"
          $results |
            Group-Object {
              # Theory display names carry their arguments, and those contain dots. Cut at the
              # first '(' before splitting, or every theory case becomes its own "class".
              $bare = ($_.testName -split '\(')[0]
              ($bare -split '\.')[-2]
            } |
            Sort-Object Name |
            ForEach-Object { Write-Host ("    {0,4}  {1}" -f $_.Count, $_.Name) }

      # Three macOS runs have now ended with a dead host, and the only thing any of them produced
      # was the name of a test. That is an instrumentation gap, not a hard problem: macOS writes a
      # full symbolicated backtrace for every crash and nothing here has ever read one.
      #
      # Two sources, because neither is guaranteed. ReportCrash may be disabled on a hosted runner,
      # and lldb needs to be able to attach — but they fail independently, so asking both is much
      # more likely to produce a stack than picking one. lldb is the better of the two when it
      # works: it re-runs the crash under a debugger rather than reading what was left behind.
      #
      # Never fatal. This step exists to explain a failure that has already happened.
      - name: If macOS crashed, get a backtrace
        if: failure() && matrix.rid == 'osx-arm64'
        run: bash tools/ci/macos-backtrace.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.rid }}
          path: '**/results.trx'
          if-no-files-found: ignore

      # What this machine cooked, for the digests job below to compare against the other three.
      # Two files: the module and the layout obey different rules, and one file could only ever be
      # compared one way.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spirv-digests-${{ matrix.rid }}
          # The modules too, ~127 KB for the corpus. A digest says two runners disagree; only the
          # words say whether the disagreement is a renumbering, and the words for the other
          # architecture exist nowhere else. tools/ci/spirv-worddiff.py reads them.
          path: |
            **/*-digests.txt
            **/spirv-modules/*.spv
          if-no-files-found: ignore

      - name: Package contains the host RID's payload
        shell: pwsh
        run: |
          # A packaging bug once excluded the host RID from the .nupkg: its files matched both the
          # Content and None globs, and Pack="false" won. The package restored cleanly and failed
          # at run time with DllNotFoundException. Cheap to assert, invisible otherwise.
          dotnet pack dotnet/PrismSlang.csproj -c Release -o pack-check --no-build --nologo
          $nupkg = Get-ChildItem pack-check -Filter *.nupkg | Select-Object -First 1
          if (-not $nupkg) { throw "no package produced" }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead($nupkg.FullName)
          try {
            $prefix = "runtimes/${{ matrix.rid }}/native/"
            $found = @($zip.Entries | Where-Object { $_.FullName.StartsWith($prefix) })
            if ($found.Count -eq 0) {
              throw "package has no payload under $prefix - the Content/None globs overlap again"
            }
            Write-Host "$prefix : $($found.Count) files"

            # Staged correctly but not packed is its own failure mode, and it only shows up for
            # consumers who install the NuGet package rather than building the repo.
            if (-not ($found | Where-Object { $_.FullName -like '*slang-glslang*' })) {
              throw "package has no slang-glslang under $prefix - shaders would compile unoptimised"
            }
          } finally { $zip.Dispose() }

  # The only check here that compares the runners against each other rather than against a claim.
  #
  # Every other oracle in the suite lives inside one process on one machine, so all four legs can be
  # green while disagreeing about what they produced — and for a cook farm that is the failure that
  # matters. A shader cooked on a developer's Windows box and the same shader cooked on a Linux
  # runner have to be the same bytes, or content hashes stop matching, incremental cooks redo
  # everything, and the asset that ships is not the asset that was tested.
  #
  # `needs: test` means this only runs when every leg passed, so a missing digest here is a
  # genuine anomaly rather than a knock-on from a failure that already reported. On a pull request
  # that is three legs, and the comparison loses nothing that matters to it: win-x64 and linux-x64
  # still check "identical within an architecture", and linux-arm64 against both still checks the
  # cross-architecture exception list. What only macOS adds is a second arm64 leg, checked on the
  # runs that include it.
  #
  # It earned its place twice. Pointed at win-x64 and linux-x64 locally it found all 28 modules
  # identical and all 28 layouts different, because the layout JSON that goes into a shader package
  # was serialized with Environment.NewLine. Then on its first real run it found the thing
  # no local pair could: the module is identical between operating *systems* and differs between
  # *architectures*, on exactly the three corpus shaders that use SV_VertexID.
  #
  # So it checks three rules rather than one — the layout everywhere, the module within an
  # architecture, and an exception list across architectures that may neither grow nor silently
  # shrink. A flat "everything matches" would now be permanently red and would report nothing.
  digests:
    name: every platform cooks the same asset
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: spirv-digests-*
          path: digests

      # The count is the argument, and it is the safeguard: a comparison that finds nothing to
      # compare has to fail, because "all legs agreed" and "no leg reported" are otherwise the same
      # green — and the second is what a renamed artifact actually produces. It is the number of
      # legs this run had, which is the matrix above.
      - run: bash tools/ci/compare-digests.sh digests ${{ inputs.macos && 4 || 3 }}
