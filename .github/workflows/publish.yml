name: Publish to GitHub Packages

# Publishes both packages on a version tag (e.g. `v0.1.0`), or on manual dispatch. The version is
# taken from the tag (`v0.1.0` -> 0.1.0); manual runs fall back to <Version> in the csproj.
#
# Two packages, deliberately:
#   PrismSlang         Slang-neutral. Compilation and reflection.
#   PrismSlang.Vulkan  The Vulkan reading of a reflection snapshot. Opt-in, so a D3D12 or Metal
#                      consumer never pulls Vulkan concepts in.
#
# Unlike PrismUSD, the native payload is not committed: runtimes/ is gitignored and fetched from
# the release pinned in Directory.Build.props. So this workflow stages every RID before packing —
# a package missing a RID would fail at run time on that platform rather than here.

# Rehearsal, and why there is one. Until a tag is pushed, everything below is code that has never
# executed — the same category CI itself was in until its first run immediately caught two things
# local runs could not. A tag is a bad place to discover that the three-RID staging is wrong,
# because the failure arrives attached to a version number.
#
# So `workflow_dispatch` accepts `dry_run`, default true: every step runs except the push. It is the
# whole path — staging win-x64, linux-x64 and osx-arm64 from a Windows runner, building, testing,
# packing all three projects, and checking that every RID in the core package carries both the
# compiler and the SPIR-V optimiser — with only the last step skipped. The .nupkg files are uploaded
# either way, so a dry run leaves something to inspect.
#
# A tag still publishes for real. dry_run only applies to a manual run.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run everything except the push to GitHub Packages'
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Stage native payloads for every supported RID
        shell: pwsh
        run: |
          # Staged from Windows for all RIDs. fetch-native.ps1 copies the real versioned library
          # and synthesises the plain-named alias, because Expand-Archive cannot create the
          # symlinks the Unix archives rely on.
          foreach ($rid in @('win-x64', 'linux-x64', 'osx-arm64')) {
            ./tools/fetch-native.ps1 -Rid $rid -Profile Spirv
          }

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          # Resolved once and applied to the build as well as the pack. Passing -p:Version only to
          # `pack --no-build` would stamp the nupkg with one version and the assembly inside it
          # with another.
          $ref = "${{ github.ref_name }}"
          $v = if ($ref -match '^v\d') { $ref.TrimStart('v') } else { '' }
          "value=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "version: $(if ($v) { $v } else { '<from csproj>' })"

      - name: Verify before publishing
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.value }}"
          $args = @('-c', 'Release', '--nologo', '-warnaserror')
          if ($v) { $args += "-p:Version=$v" }
          dotnet build PrismSlang.slnx @args
          if ($LASTEXITCODE -ne 0) { throw "build failed" }
          dotnet test PrismSlang.slnx -c Release --no-build --nologo
          if ($LASTEXITCODE -ne 0) { throw "tests failed" }

      - name: Pack
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.value }}"
          $extra = if ($v) { @("-p:Version=$v") } else { @() }
          foreach ($proj in @('runtime/PrismSlang.Runtime.csproj', 'dotnet/PrismSlang.csproj', 'vulkan/PrismSlang.Vulkan.csproj')) {
            dotnet pack $proj -c Release -o artifacts --no-build @extra
            if ($LASTEXITCODE -ne 0) { throw "pack failed for $proj" }
          }

      - name: Every RID in the package carries the compiler and the SPIR-V optimiser
        shell: pwsh
        run: |
          # The test suite only exercises the host RID; a staging failure on linux-x64 or osx-arm64
          # would publish silently and fail on the consumer's machine. Without slang-glslang the
          # failure is worse than a missing file: Slang still compiles, just unoptimised, and says
          # so once per global session on a successful result.
          # The core package is the only one that should carry a payload at all. Matched by an
          # exact prefix rather than by excluding the others one at a time: PrismSlang.Runtime was
          # added later and would have slipped through a not-like list, and it is precisely the
          # package whose whole purpose is to have no payload.
          $nupkg = Get-ChildItem artifacts -Filter 'PrismSlang.*.nupkg' |
                   Where-Object { $_.Name -match '^PrismSlang\.\d' } | Select-Object -First 1
          if (-not $nupkg) { throw "no PrismSlang core package in artifacts/" }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead($nupkg.FullName)
          try {
            foreach ($rid in @('win-x64', 'linux-x64', 'osx-arm64')) {
              $prefix = "runtimes/$rid/native/"
              $files = @($zip.Entries | Where-Object { $_.FullName.StartsWith($prefix) })
              foreach ($needed in @('slang-compiler', 'slang-glslang')) {
                if (-not ($files | Where-Object { $_.FullName -like "*$needed*" })) {
                  throw "package is missing $needed under $prefix"
                }
              }
              Write-Host ("    {0,-12} {1} files" -f $rid, $files.Count)
            }
          } finally { $zip.Dispose() }

      - name: Dry run — everything above ran, the push is skipped
        if: inputs.dry_run
        shell: pwsh
        run: |
          $pkgs = Get-ChildItem -Path artifacts -Filter *.nupkg
          if (-not $pkgs) { throw "no .nupkg produced in artifacts/" }
          Write-Host "would push:"
          $pkgs | ForEach-Object { Write-Host ("    {0,-46} {1,7:N0} KB" -f $_.Name, ($_.Length / 1KB)) }
          Write-Host ""
          Write-Host "Dry run. Re-run with dry_run unchecked, or push a v* tag, to publish."

      - name: Push to GitHub Packages
        if: ${{ !inputs.dry_run }}
        shell: pwsh
        run: |
          $pkgs = Get-ChildItem -Path artifacts -Filter *.nupkg
          if (-not $pkgs) { throw "no .nupkg produced in artifacts/" }
          foreach ($pkg in $pkgs) {
            Write-Host "Pushing $($pkg.Name)"
            dotnet nuget push $pkg.FullName `
              --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" `
              --api-key "${{ secrets.GITHUB_TOKEN }}" `
              --skip-duplicate
          }

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/*.nupkg
