name: Publish

# Publishes every package on a version tag (e.g. `v0.1.0`), or on manual dispatch: to GitHub
# Packages, where consumers restore from, and — on a tag — as a GitHub release carrying the same
# .nupkg files, the way PrismNRI publishes. The release is the durable, browsable record and the
# one place a consumer without feed access (tools/fetch-nri.ps1 is the same idea, pointed the other
# way) can download the packages from. The tag has to equal `v` + <Version> in the five csproj
# files, checked first, so that the version a package carries, the tag, the release name and the
# README's "Status" line cannot disagree; manual runs have no tag and build whatever <Version> says.
#
# Five packages, deliberately:
#   PrismSlang             Slang-neutral. Compilation and reflection.
#   PrismSlang.Runtime     Reads baked shaders in the shipped game. No compiler, no native payload.
#   PrismSlang.Vulkan      The Vulkan reading of a reflection snapshot. Opt-in, so a D3D12 or Metal
#                          consumer never pulls Vulkan concepts in.
#   PrismSlang.NRI         The NRI (NVIDIA Render Interface) reading of a reflection snapshot, onto
#                          PrismNRI's descs. Opt-in like the Vulkan one.
#   PrismSlang.Native.Dxc  Puts Microsoft's dxc beside the compiler so Slang can emit DXIL. No
#                          binary of its own: a dependency on Microsoft.Direct3D.DXC and a targets
#                          file that copies from it. Opt-in, for D3D12 only.
#
# Unlike PrismUSD, the native payload is not committed: runtimes/ is gitignored and fetched from
# the release pinned in Directory.Build.props. So this workflow stages every RID before packing —
# a package missing a RID would fail at run time on that platform rather than here.

# Rehearsal, and why there is one. Until a tag is pushed, everything below is code that has never
# executed — the same category CI itself was in until its first run immediately caught two things
# local runs could not. A tag is a bad place to discover that the four-RID staging is wrong,
# because the failure arrives attached to a version number.
#
# So `workflow_dispatch` accepts `dry_run`, default true: every step runs except the push. It is the
# whole path — the full CI matrix on all four RIDs, macOS included, then staging all four payloads
# from a Windows runner, building, testing, packing all five projects, checking that every RID in
# the core package carries the compiler, the SPIR-V optimiser and Slang's licence texts, and that
# the dxc package carries its targets and no binary — with only the last step skipped. The .nupkg
# files are uploaded either way, so a dry run leaves something to inspect. At October 2026 prices
# a run, dry or real, is about $0.60, most of it the macOS leg.
#
# A tag still publishes for real. dry_run only applies to a manual run, and a manual run never
# creates a release: there is no tag to attach one to.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run everything except the push to GitHub Packages'
        type: boolean
        default: true

# contents: write for the release step and nothing else; the checkout and the build need read.
permissions:
  contents: write
  packages: write

jobs:
  # The tag names the version, and so does every csproj. Checked before anything is built or
  # tested, in a job of its own on the cheapest runner, so a tag pushed against the wrong <Version>
  # fails in seconds with both values named — rather than after the full test matrix, or worse,
  # publishing packages whose assembly version disagrees with the release they sit on. The same
  # check PrismNRI's release workflow makes. A manual run has no tag, and the step is skipped
  # rather than the job, so the jobs that need this one still run.
  version:
    name: tag equals v<Version>
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Tag equals v<Version>
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $projects = 'runtime/PrismSlang.Runtime.csproj', 'dotnet/PrismSlang.csproj', 'vulkan/PrismSlang.Vulkan.csproj',
                      'nri/PrismSlang.NRI.csproj', 'native/PrismSlang.Native.Dxc.csproj'
          $versions = foreach ($p in $projects) {
            if ((Get-Content $p -Raw) -notmatch '<Version>([^<]+)</Version>') { throw "<Version> not found in $p" }
            [pscustomobject]@{ Project = $p; Version = $Matches[1].Trim() }
          }
          $versions | Format-Table -AutoSize | Out-String | Write-Host
          $version = $versions[0].Version
          $odd = @($versions | Where-Object Version -ne $version)
          if ($odd) { throw "package versions disagree: $(($odd | ForEach-Object { "$($_.Project)=$($_.Version)" }) -join ', ') vs $($versions[0].Project)=$version" }
          if ($env:RELEASE_TAG -cne "v$version") { throw "tag '$env:RELEASE_TAG' is not 'v$version' (<Version> in the csproj files)" }
          if ((Get-Content README.md -Raw) -notmatch [regex]::Escape("``$version``")) { throw "README.md's Status line does not say ``$version``" }

  # The full test matrix, macOS included, before anything is packed. On a pull request the
  # osx-arm64 leg only runs when asked for (ci.yml explains the cost), so this is where every RID a
  # package ships is guaranteed to have been tested — by the run that publishes it. The same
  # workflow CI runs, called rather than copied, so the two cannot drift.
  test:
    needs: version
    uses: ./.github/workflows/ci.yml
    with:
      macos: true
    secrets: inherit

  publish:
    needs: [version, test]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # The preview quality is there because .NET 11 has no GA release yet; drop it when it does.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: preview

      - name: Stage native payloads for every supported RID
        shell: pwsh
        run: |
          # Staged from Windows for all RIDs. fetch-native.ps1 copies the real versioned library
          # and synthesises the plain-named alias, because Expand-Archive cannot create the
          # symlinks the Unix archives rely on.
          # Every RID a CI leg verifies. linux-arm64 was missing here while ubuntu-24.04-arm ran the
          # full suite on it every push, so the one architecture with its own calling convention was
          # tested and then not shipped — a consumer on it would have resolved no payload at all.
          foreach ($rid in @('win-x64', 'linux-x64', 'linux-arm64', 'osx-arm64')) {
            ./tools/fetch-native.ps1 -Rid $rid -Profile Spirv
          }

      # Into the folder feed nuget.config names, nupkg-feed/, for PrismSlang.NRI and the tests.
      # PrismNRI is a private repository, so a fine-grained PAT with read access to its contents
      # (Contents: read) is stored on THIS repository as the secret PRISMNRI_READ_TOKEN. The job's
      # own GITHUB_TOKEN cannot stand in: it is scoped to the repository the workflow runs in, and
      # another repository's release assets are outside that scope whatever `permissions:` says.
      - name: Fetch the PrismNRI packages
        shell: pwsh
        env:
          PRISMNRI_TOKEN: ${{ secrets.PRISMNRI_READ_TOKEN }}
        run: ./tools/fetch-nri.ps1

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          # Resolved once and applied to the build as well as the pack. Passing -p:Version only to
          # `pack --no-build` would stamp the nupkg with one version and the assembly inside it
          # with another.
          $ref = "${{ github.ref_name }}"
          $v = if ($ref -match '^v\d') { $ref.TrimStart('v') } else { '' }
          "value=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "version: $(if ($v) { $v } else { '<from csproj>' })"

      - name: Verify before publishing
        shell: pwsh
        env:
          # For SlangTestCorpus's GitHub API call, as in ci.yml: a cold cache on a tag build must
          # not depend on the runner IP's unauthenticated budget.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Built up as an array and never assigned from an `if`, for the reason the Pack step
          # records. Not named $args: that is PowerShell's automatic parameter variable, and
          # assigning to it works until the day it does not.
          $v = "${{ steps.version.outputs.value }}"
          $buildArgs = @('-c', 'Release', '--nologo', '-warnaserror')
          if ($v) { $buildArgs += "-p:Version=$v" }
          dotnet build PrismSlang.slnx @buildArgs
          if ($LASTEXITCODE -ne 0) { throw "build failed" }
          dotnet test PrismSlang.slnx -c Release --no-build --nologo
          if ($LASTEXITCODE -ne 0) { throw "tests failed" }

      - name: Pack
        shell: pwsh
        run: |
          # The version argument is appended to an array, not assigned from an `if`. The first
          # tagged run, v0.1.0-alpha's, failed here and only here: `$extra = if ($v) { @("x") }`
          # hands the if-statement's output through the pipeline, which unrolls a one-element
          # array to the string, and splatting a string enumerates its characters — MSBuild was
          # invoked with `- p : V e r s i o n = 0 . 1 . 0 - a l p h a`, one letter per argument.
          # Every dry run had passed, because without a tag $v is empty and the else branch's
          # empty array splats to nothing. Measured on run #5 of this workflow.
          $v = "${{ steps.version.outputs.value }}"
          $extra = @()
          if ($v) { $extra += "-p:Version=$v" }
          foreach ($proj in @('runtime/PrismSlang.Runtime.csproj', 'dotnet/PrismSlang.csproj', 'vulkan/PrismSlang.Vulkan.csproj', 'nri/PrismSlang.NRI.csproj', 'native/PrismSlang.Native.Dxc.csproj')) {
            dotnet pack $proj -c Release -o artifacts --no-build @extra
            if ($LASTEXITCODE -ne 0) { throw "pack failed for $proj" }
          }

      - name: Every RID in the package carries the compiler and the SPIR-V optimiser
        shell: pwsh
        run: |
          # The test suite only exercises the host RID; a staging failure on linux-x64 or osx-arm64
          # would publish silently and fail on the consumer's machine. Without slang-glslang the
          # failure is worse than a missing file: Slang still compiles, just unoptimised, and says
          # so once per global session on a successful result.
          # The core package is the only one that should carry a payload at all. Matched by an
          # exact prefix rather than by excluding the others one at a time: PrismSlang.Runtime was
          # added later and would have slipped through a not-like list, and it is precisely the
          # package whose whole purpose is to have no payload.
          $nupkg = Get-ChildItem artifacts -Filter 'PrismSlang.*.nupkg' |
                   Where-Object { $_.Name -match '^PrismSlang\.\d' } | Select-Object -First 1
          if (-not $nupkg) { throw "no PrismSlang core package in artifacts/" }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead($nupkg.FullName)
          try {
            foreach ($rid in @('win-x64', 'linux-x64', 'linux-arm64', 'osx-arm64')) {
              $prefix = "runtimes/$rid/native/"
              $files = @($zip.Entries | Where-Object { $_.FullName.StartsWith($prefix) })
              foreach ($needed in @('slang-compiler', 'slang-glslang')) {
                if (-not ($files | Where-Object { $_.FullName -like "*$needed*" })) {
                  throw "package is missing $needed under $prefix"
                }
              }

              # Redistributing the binaries means carrying their terms. Checked per RID, because the
              # licences are staged by the same script in the same pass as the payload: a RID whose
              # staging half-failed would ship the compiler without them. The exact path matters —
              # NuGet treats an extensionless PackagePath as a directory, which silently packed
              # Slang's LICENSE to runtimes/<rid>/LICENSE/<rid>/LICENSE once.
              foreach ($terms in @("runtimes/$rid/LICENSE.txt", "runtimes/$rid/LICENSES/Apache-2.0.txt")) {
                if (-not ($zip.Entries | Where-Object { $_.FullName -eq $terms })) {
                  throw "package is missing $terms - see THIRD-PARTY-NOTICES.md"
                }
              }

              Write-Host ("    {0,-12} {1} files, licences present" -f $rid, $files.Count)
            }

            if (-not ($zip.Entries | Where-Object { $_.FullName -eq 'THIRD-PARTY-NOTICES.md' })) {
              throw "package does not carry THIRD-PARTY-NOTICES.md"
            }
          } finally { $zip.Dispose() }

      - name: The dxc package carries its targets, the pinned dependency, and no binary
        shell: pwsh
        run: |
          # The shape of this package is a licensing decision, not a packaging convenience: it
          # must redistribute nothing of Microsoft's, because Microsoft's terms for dxc forbid a
          # stand-alone offering of it, and must instead depend on Microsoft's own package at the
          # pinned version and carry the targets that copy from it. Any binary under runtimes/
          # here would be a redistribution nobody decided on; a missing targets file would be a
          # dependency that restores cleanly and leaves Slang unable to emit DXIL; a floating
          # dependency would pair the targets' path with a version it does not name.
          $nupkg = Get-ChildItem artifacts -Filter 'PrismSlang.Native.Dxc.*.nupkg' | Select-Object -First 1
          if (-not $nupkg) { throw "no PrismSlang.Native.Dxc package in artifacts/" }

          $props = Get-Content Directory.Build.props -Raw
          if ($props -notmatch '<DxcPackageVersion>([^<]+)</DxcPackageVersion>') { throw "DxcPackageVersion not found in Directory.Build.props" }
          $pinned = $Matches[1].Trim()

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead($nupkg.FullName)
          try {
            foreach ($path in @('build/PrismSlang.Native.Dxc.targets', 'THIRD-PARTY-NOTICES.md')) {
              if (-not ($zip.Entries | Where-Object { $_.FullName -eq $path })) {
                throw "PrismSlang.Native.Dxc is missing $path"
              }
            }

            $binaries = @($zip.Entries | Where-Object { $_.FullName -like 'runtimes/*' -or $_.FullName -like '*.dll' })
            if ($binaries.Count -gt 0) {
              throw "PrismSlang.Native.Dxc carries binaries it must not redistribute: $(($binaries | ForEach-Object FullName) -join ', ')"
            }

            $nuspec = $zip.Entries | Where-Object { $_.FullName -like '*.nuspec' } | Select-Object -First 1
            $reader = New-Object System.IO.StreamReader($nuspec.Open())
            try { $text = $reader.ReadToEnd() } finally { $reader.Dispose() }
            if ($text -notmatch "id=`"Microsoft.Direct3D.DXC`" version=`"\[$([regex]::Escape($pinned))\]`"") {
              throw "PrismSlang.Native.Dxc does not depend on Microsoft.Direct3D.DXC at exactly [$pinned]; the nuspec says:`n$text"
            }

            $targets = $zip.Entries | Where-Object { $_.FullName -eq 'build/PrismSlang.Native.Dxc.targets' }
            $reader = New-Object System.IO.StreamReader($targets.Open())
            try { $text = $reader.ReadToEnd() } finally { $reader.Dispose() }
            if ($text -notmatch [regex]::Escape(">$pinned<")) {
              throw "the targets file names a different Microsoft.Direct3D.DXC version than the pinned $pinned"
            }

            Write-Host "    targets present, depends on Microsoft.Direct3D.DXC [$pinned], no binary carried"
          } finally { $zip.Dispose() }

      - name: Dry run — everything above ran, the push is skipped
        if: inputs.dry_run
        shell: pwsh
        run: |
          $pkgs = Get-ChildItem -Path artifacts -Filter *.nupkg
          if (-not $pkgs) { throw "no .nupkg produced in artifacts/" }
          Write-Host "would push:"
          $pkgs | ForEach-Object { Write-Host ("    {0,-46} {1,7:N0} KB" -f $_.Name, ($_.Length / 1KB)) }
          Write-Host ""
          Write-Host "Dry run. Re-run with dry_run unchecked to push to GitHub Packages, or push a v* tag to push and create the release."

      - name: Push to GitHub Packages
        if: ${{ !inputs.dry_run }}
        shell: pwsh
        run: |
          $pkgs = Get-ChildItem -Path artifacts -Filter *.nupkg
          if (-not $pkgs) { throw "no .nupkg produced in artifacts/" }
          foreach ($pkg in $pkgs) {
            Write-Host "Pushing $($pkg.Name)"
            dotnet nuget push $pkg.FullName `
              --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" `
              --api-key "${{ secrets.GITHUB_TOKEN }}" `
              --skip-duplicate
          }

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/*.nupkg

      # The release, with every package attached. Prerelease whenever the version carries a
      # suffix (`0.1.0-alpha`), which is how the README's "alpha" is spelled on the releases page;
      # the notes are GitHub's, generated from the merged pull requests since the previous tag,
      # which is where the measured facts of each change already are. fail_on_unmatched_files, so
      # a pack that produced nothing cannot publish an empty release.
      - uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag'
        with:
          tag_name: ${{ github.ref_name }}
          name: PrismSlang ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: artifacts/*.nupkg
